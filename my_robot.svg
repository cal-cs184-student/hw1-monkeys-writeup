<?xml version="1.0" encoding="utf-8"?>
<!-- my_robot.svg: cubeman waving hello mid-stride.
     Built from robot.svg using hierarchical transforms: each limb is a group
     translated to its joint, rotated there, and its child segment hangs off the
     end, so rotating a shoulder also carries the elbow and hand with it. -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 width="500.0px" height="500.0px" viewBox="0 0 500 500" enable-background="new 0 0 500 500"
	 xml:space="preserve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<g transform="translate(250 260)">
	<!-- torso (blue) -->
	<polygon fill="#2B6CB0" points="-50,-50 50,-50 -50,50 "/>
	<polygon fill="#2B6CB0" points="-50,50 50,-50 50,50"/>

	<!-- head (gold), tilted toward the waving hand -->
	<g transform="translate(5 -100)">
		<g transform="rotate(60)">
			<g transform="scale(.5 .5)">
				<polygon fill="#F2B705" points="-50,-50 50,-50 -50,50 "/>
				<polygon fill="#F2B705" points="-50,50 50,-50 50,50"/>
			</g>
		</g>
	</g>

	<!-- right arm: waving. shoulder -> upper arm -> elbow -> forearm -> hand -->
	<g transform="translate(55 -40)">
		<g transform="rotate(-55)">
			<g transform="translate(35 0)">
				<g transform="scale(.6 .2)">
					<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
					<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
				</g>
			</g>
			<g transform="translate(75 0)">
				<g transform="rotate(-55)">
					<g transform="translate(35 0)">
						<g transform="scale(.6 .2)">
							<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
					<!-- hand -->
					<g transform="translate(80 0)">
						<g transform="scale(.25 .25)">
							<polygon fill="#F2B705" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#F2B705" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
				</g>
			</g>
		</g>
	</g>

	<!-- left arm: relaxed, hanging down and slightly back -->
	<g transform="translate(-55 -40)">
		<g transform="rotate(-65)">
			<g transform="translate(-35 0)">
				<g transform="scale(.6 .2)">
					<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
					<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
				</g>
			</g>
			<g transform="translate(-75 0)">
				<g transform="rotate(-20)">
					<g transform="translate(-35 0)">
						<g transform="scale(.6 .2)">
							<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
				</g>
			</g>
		</g>
	</g>

	<!-- left leg: stepping back. hip -> thigh -> knee -> shin -->
	<g transform="translate(-30 55)">
		<g transform="rotate(20)">
			<g transform="translate(0 35)">
				<g transform="scale(.2 .6)">
					<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
					<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
				</g>
			</g>
			<g transform="translate(0 75)">
				<g transform="rotate(-25)">
					<g transform="translate(0 35)">
						<g transform="scale(.2 .6)">
							<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
				</g>
			</g>
		</g>
	</g>

	<!-- right leg: stepping forward -->
	<g transform="translate(30 55)">
		<g transform="rotate(-25)">
			<g transform="translate(0 35)">
				<g transform="scale(.2 .6)">
					<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
					<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
				</g>
			</g>
			<g transform="translate(0 75)">
				<g transform="rotate(15)">
					<g transform="translate(0 35)">
						<g transform="scale(.2 .6)">
							<polygon fill="#EF161F" points="-50,-50 50,-50 -50,50 "/>
							<polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
						</g>
					</g>
				</g>
			</g>
		</g>
	</g>
</g>

</svg>
